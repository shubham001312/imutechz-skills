- id: p1
  type: statement
  say: A model can only work with what you give it. A well designed prompt guides
    it toward answers that are more accurate, and more relevant.
  transition: defocus
  params:
    lines:
    - text: A better prompt
      word: well
      size: 110
    - text: '*More accurate. More relevant.*'
      word: accurate
      size: 78
- id: p2
  type: cards
  say: Here are the main techniques. Zero shot means you just ask. Few shot means
    you show a few examples first. Chain of thought gets the model to work step by
    step.
  transition: defocus
  params:
    kicker: PROMPTING TECHNIQUES
    title: Start simple
    items:
    - tag: ZERO-SHOT
      t: Just ask
      word: zero
    - tag: FEW-SHOT
      t: Show a few examples
      word: few
    - tag: CHAIN OF THOUGHT
      t: Work step by step
      word: chain
- id: p3
  type: cards
  say: Self consistency compares several answers, and goes with the one they agree
    on. React mixes reasoning with actions. And retrieval augmented prompting pulls
    in relevant information first, using exactly what you learned in step three.
  transition: defocus
  params:
    kicker: PROMPTING TECHNIQUES
    title: Then go further
    items:
    - tag: SELF-CONSISTENCY
