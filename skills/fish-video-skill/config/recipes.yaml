# Recipes: a proven video format as a starting point.   fishvideo new <dir> --recipe <id> --prompt "..."
# A recipe prefills the brief (theme, pacing, mix, the Chatterbox soft voice), a storyboard SKELETON (scene types and
# structure only: every word is a TODO you must write), an asset plan (assets/PLAN.md) and the measured imagery gate
# (fishvideo gates). Thresholds were tuned on the three benchmark videos so they pass, and a text-card video fails.
#   roadmap-explainer  <- the long GenAI roadmap video (555 s: 44% images, 13 new images/min, 36% text cards)
#   story-short        <- the two Onoda Shorts (26 s: photo-led frames, 14 new images/min)
#   bold-short         <- the bold typographic Short (all drawn shapes, huge words, no photographs)
# sharp_share_min: measured on the rendered frames (QA), the share of the frame covered by sharp picture rather than a blurred backdrop.
# The gate keys: image_share_min, image_beats_min (share of beats with a real image), image_changes_pm_min, longest_no_image_max (s), text_share_max,
# graphic_share_min, screenshot_of_images_max (a site screenshot may not be the main visual). Every image must also exist, carry source, licence and author in
# assets/credits.json, and photos of people or events need `label: archive photo|illustrative`. Opt-out only on the user's request: visuals: {mode: abstract, user_asked: true, reason: "..."}.

shared:
  voice: {provider: chatterbox, language: en-US, studio: {gender: male, style: chatterbox-soft, pace: natural}}
  pacing: {snap: speech, lead_in: 0.1, tail: 0.15, max_word_gap: 0.9, line_gap: 0.2}
  mix: {music_under_voice_db: -12}
  captions: {style: pop}

recipes:
  roadmap-explainer:
    label: "Roadmap explainer (long)"
    from: "video #004: the GenAI engineer roadmap"
    best_for: "learning paths, 'how to become X', tool landscapes, multi-step guides (5 to 10 minutes)"
    structure: explainer
    goal: teach
    audience: "beginners who want a clear order to learn things in"
    language: en-US
    platforms: [youtube]
    length: 420
    themes: [tech-dark, minimal-light, editorial-serif, news-broadcast]
    theme: tech-dark
    style: neon-diagram
    music: lofi-tech
    pacing: {change_every: 0.75, hard_cuts_per_15s: 1, transitions: [cut, zoom, flash]}
    mix: {music_under_voice_db: -12, sfx_levels: {trombone: -14, laugh: -16, applause: -16}}
    gate: {image_share_min: 0.40, image_changes_pm_min: 10, longest_no_image_max: 45, text_share_max: 0.40, image_beats_min: 0.35, screenshot_of_images_max: 0.80, photo_share_min: 0.10}
    steps: 5                  # how many stops the roadmap has; the step block repeats this many times
    beats:
      - {id: hook,    type: story,     bars: 2, note: "frame 0 is a real image that shows the pain (not a title). One line, huge."}
      - {id: chaos,   type: pile,      bars: 3, note: "real site screenshots land one by one and bury the viewer; a line lands last"}
      - {id: promise, type: statement, bars: 2, note: "one calm promise over a dimmed real photo (src)"}
      - {id: map,     type: roadmap,   bars: 4, note: "open on the whole map (open_wide), then fly stop to stop on spoken words; every node has a src or a glyph"}
      - {repeat: step, scenes: [
          {id: "step{n}_site",  type: site,    bars: 4, note: "the real site or tool of this step in a browser frame, notes land beside it"},
          {id: "step{n}_cards", type: cards,   bars: 3, note: "the 3 things to learn; cards are visible dimmed from frame 0, each lights on its word"},
          {id: "step{n}_meme",  type: footage, bars: 2, note: "a licensed reaction or b-roll clip with a cue sound (assets search --kind video); skip only if the tone is serious"}]}
      - {id: recap,   type: roadmap,   bars: 4, note: "pull back: the whole map lights up (pull_word, reveal_all, cta)"}
      - {id: end,     type: end,       bars: 2, note: "one line CTA"}
    assets:
      - {need: "hero photo or clip for the hook and the promise", how: "assets source <dir> '<what it shows>' --beat <id>", count: 2}
      - {need: "one real website or tool screenshot per roadmap stop", how: "fishvideo capture <dir> (website tour) or assets shot", count: "steps"}
      - {need: "3 to 6 site screenshots for the pile", how: "assets shot <dir> <url>", count: 4}
      - {need: "one licensed reaction clip or b-roll per step", how: "assets search <dir> '<mood>' --kind video  (memes need the viral opt-in)", count: "steps"}
      - {need: "logos of the tools named, for the thumbnail", how: "fishvideo thumb logos --find <name>", count: 6}
  story-short:
    label: "Story Short (photo-led)"
    from: "video #005: the two Onoda Shorts"
    best_for: "history, true stories, people, 'the man who...' in 20 to 45 seconds; part one and part two series"
    structure: story
    end_card: false
    audience: "general viewers curious about history and true stories"
    language: en-US
    goal: explain
    platforms: [shorts]
    length: 28
    themes: [archive-doc, noir-crime, news-broadcast, luxury-finance, nature-calm]
    theme: archive-doc
    style: glow-metaphor
    music: dark-drone
    pacing: {change_every: 1.0, hard_cuts_per_15s: 2, transitions: [flash, zoom, cut], snap: speech, lead_in: 0.1, tail: 0.15, max_word_gap: 0.9, line_gap: 0.2}
    gate: {sharp_share_min: 0.45, image_share_min: 0.85, image_changes_pm_min: 10, longest_no_image_max: 6, text_share_max: 0.10, image_beats_min: 0.85, screenshot_of_images_max: 0.0, photo_share_min: 0.85}
    beats:
      - {id: s1, type: story, bars: 2, note: "hook: the most striking real photo, one huge line that states the surprise. Frame 0 is already full."}
      - {id: s2, type: story, bars: 2, note: "the setup: date or place on screen (motif: date or route), kicker names the series"}
      - {id: s3, type: story, bars: 2, note: "the turn: a second photo swaps in mid-scene (srcs) when the narration changes subject"}
      - {id: s4, type: story, bars: 2, note: "escalation (motif: rings or dust)"}
      - {id: s5, type: story, bars: 2, note: "the twist"}
      - {id: s6, type: story, bars: 2, note: "open loop: end on a question or the next fact; no logo, no thanks. Use a PART 2 stamp or kicker ONLY when brief.series is true"}
    assets:
      - {need: "one real photo per scene (6), PD or CC licensed, portrait-friendly", how: "assets source <dir> '<person or place>' --beat <id> [--depicts '<who>'] (Commons, NASA, Library of Congress)", count: 6}
      - {need: "a second photo for the scene that swaps (srcs)", how: "assets source <dir> '<query>' --beat <id>", count: 1}
      - {need: "credit every photo: assets/credits.json is filled by `assets get`", how: "automatic", count: 0}
  bold-short:
    label: "Bold typographic Short"
    from: "video #002: the bold cut-paper Short"
    best_for: "deadlines, facts, news, rules and lists when no licensed photo exists; huge words on flat colour"
    structure: listicle
    end_card: false
    audience: "general viewers who want one clear rule fast"
    language: en-US
    goal: explain
    platforms: [shorts]
    length: 30
    themes: [bold-shorts, comic-pop, news-broadcast, kids-playful, retro-arcade]
    theme: bold-shorts
    style: studio-kinetic
    music: hiphop-groove
    pacing: {change_every: 0.9, hard_cuts_per_15s: 3, transitions: [cut, flash], snap: speech, lead_in: 0.1, tail: 0.15, max_word_gap: 0.9, line_gap: 0.2}
    gate: {image_share_min: 0.0, image_changes_pm_min: 0, longest_no_image_max: 9999, text_share_max: 0.15, graphic_share_min: 0.85, image_beats_min: 0.0, screenshot_of_images_max: 0.0, photo_share_min: 0.0}
    beats:
      - {id: hook,  type: bold, bars: 2, note: "the claim in 2 to 4 giant words; shape: burst or circle"}
      - {id: b1,    type: bold, bars: 2, note: "one fact per scene; change the ground colour (g) every scene"}
      - {id: b2,    type: bold, bars: 2, note: "one fact"}
      - {id: b3,    type: bold, bars: 2, note: "one fact"}
      - {id: b4,    type: bold, bars: 2, note: "the twist"}
      - {id: end,   type: bold, bars: 2, note: "the rule to remember; shape: bar"}
    assets:
      - {need: "none required. Add a real photo or a brand logo cut-out (assets cutout) to a scene whenever the topic has one", how: "assets search / thumb logos", count: 0}
