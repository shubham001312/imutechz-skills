  transition: defocus
  params:
    src: assets/shots/ollama.jpg
    url: ollama.com
    kicker: STEP 2
    title: Connect to *real models*
    notes:
    - text: OpenAI and Ollama
      word: OpenAI
    - text: GPT, Claude, LLaMA, Falcon
      word: models
