# Fish Video Skill defaults. A project's brief.yaml overrides any of these
# keys (deep merge). Numbers here are the tested defaults, not suggestions.

tempo:
  bpm: 120            # one bar = 2.0 s; every cut lands on a bar line
  beats_per_bar: 4

pacing:
  snap: speech       # narration drives time: scene cuts follow the last word ("bar" = the old 2 s bar grid, opt-in; "beat" = alias of speech)
  lead_in: 0.1        # s from scene start to the first spoken word (kept 0.05-0.15)
  line_gap: 0.25      # s between narration lines inside a scene (kept 0.15-0.35); a line may add `pause:` up to 0.8 s
  tail: 0.15          # s after the last word before the cut (kept 0.1-0.2); cut + lead_in = 0.15-0.35 s between scenes
  wpm:                # speaking rate used to estimate before TTS exists
    default: 150
    en-IN: 145
    en-US: 155
    en-GB: 150
    hi-IN: 130
    es: 160
    fr: 150
    de: 140
  min_scene:          # s a scene needs on screen even without narration
    title: 4.0
    kinetic: 3.0
    bullets: 4.0
    stat: 4.0
    chart: 5.0
    diagram: 5.0
    whiteboard: 6.0
    steps: 5.0
    quote: 4.0
    compare: 5.0
    terminal: 5.0
    tour: 4.0
    meme: 5.0
    image: 4.0
    end: 4.0
    thumbnail: 1.0

# Voice. Default: the ElevenLabs voice chosen for ImuTechz (English, India).
# Without ELEVENLABS_API_KEY (environment or the project/skill .env) the
# free edge-tts fallback is used and the build says so.
voice:
  provider: elevenlabs
  language: en-IN
  elevenlabs:
    voice_id: fydPJq00SigRIaPxWgiS
    voice_url: https://elevenlabs.io/voices/fydPJq00SigRIaPxWgiS
    model_id: eleven_multilingual_v2
    language_code: null
    output_format: mp3_44100_128
    voice_settings:
      stability: 0.42
      similarity_boost: 0.8
      style: 0.18
      use_speaker_boost: true
      speed: 0.96
    use_context: true
    max_speed: 1.12
  fallback:
    provider: edge-tts
    voice: en-IN-NeerjaNeural
    rate: "-6%"
    pitch: "+0Hz"
    volume: "+0%"
    max_rate: "+8%"
  # applied to the voice track: rumble cut, low-mid cleanup, presence + air, gentle compression, a short soft room
  post: "highpass=f=85,equalizer=f=280:t=q:w=1.2:g=-2,equalizer=f=4800:t=q:w=1.4:g=1.5,highshelf=f=9000:g=3,acompressor=threshold=-20dB:ratio=2.5:attack=8:release=120:makeup=2,aecho=0.9:0.9:23|41:0.07|0.04"

# Three stems (references/sound-design.md). Numbers come from measuring the reference Shorts.
mix:
  voice_lufs: -16            # voice stem level before summing
  music_under_voice_db: -10  # music under the voice, measured ON A SIMULATED PHONE SPEAKER, so it stays audible everywhere
  music_max_fullband_db: -8  # ...but never louder than this under the voice full-range (headphones stay balanced)
  music_carve_db: -1.5       # gentle static mid dip; the duck makes room for words. A deep dip kills music on phones
  translate:                 # small-speaker translation: bass harmonics the ear hears as bass (references/sound-design.md)
    music_drive_db: 14
    music_harmonics_db: -4
    music_width: 0.85        # slightly narrower stereo, so a mono phone speaker does not cancel it
    sfx_drive_db: 16
    sfx_harmonics_db: -6
  sfx_gain_db: 0             # manual trim on the SFX stems (never ducked)
  sfx_under_voice_db: -7     # on a phone, a typical SFX event peaks this far under typical speech (auto-calibrated)
  sfx_max_boost_db: 12
  duck:                      # sidechain: the voice ducks the music ~6 dB while speaking
    threshold: 0.05
    ratio: 3
    attack: 10
    release: 250
    makeup: 1
  loudness: -14            # LUFS integrated (overridden per platform)
  true_peak: -1.5          # dBTP
  lra: 11

score:
  key: D
  mode: minor
  progression: i-VI-III-VII
  seed: 12345
  drums: true
  sfx: true

captions:
  max_chars: 42
  max_lines: 2
  min_cue: 0.9            # s
  max_cps: 20             # characters per second (reading speed)

# Platform profiles. safe = margins (px) kept clear of UI overlays; scenes
