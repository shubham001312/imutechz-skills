- id: ds
  type: site
  say: The guide starts with two foundations. The first is data science. That simply
    means using statistics, analysis, and code, to pull useful insights out of data,
    whether it's tidy tables or messy text.
  transition: defocus
  params:
    src: assets/shots/sklearn.jpg
    url: scikit-learn.org
    kicker: FOUNDATION 1
    title: Data science
    notes:
    - text: Statistics and analysis
      word: statistics
    - text: Pull *insights* out of data
      word: insights
    - text: Tidy tables or messy text
      word: tables
- id: ml
  type: flow
  say: The second is machine learning, where you don't write the rules yourself. You
    show a computer examples, and it learns to make predictions from them.
  transition: defocus
  params:
    kicker: FOUNDATION 2
    title: Machine learning
    nodes:
    - label: Examples
      glyph: '[ ]'
      sub: data you show it
      word: examples
    - label: Learning
      glyph: f(x)
      sub: no hand-written rules
      word: learns
    - label: Predictions
      glyph: => ?
      sub: on data it has not seen
      word: predictions
- id: whybasics
  type: statement
  say: Why bother? Because everything later is built on these ideas. When a model
    gives you a strange answer, this is the knowledge that helps you work out why.
    The guide asks for solid foundations here, so take your time. Get comfortable,
    and then move on.
  transition: defocus
  params:
    lines:
    - text: Everything later is *built on this*
      word: everything
    - text: A strange answer? This helps you work out why
      word: strange
      size: 58
    - text: So *take your time*
      word: take
      size: 72
- id: s1
  type: roadmap
  say: Step one is the key concepts. These are the ideas inside modern generative
    models, and you'll keep running into them.
  chapter: 'Step 1: Key concepts'
  transition: defocus
  params:
    kicker: THE GENAI ENGINEER ROADMAP
    nodes: *id001
    open_wide: 1.1
    visits:
    - i: 0
      t: 0
    - i: 1
      t: 1.0
      word: key
- id: att1
  type: attention
  say: Let's begin with attention. When you read a long sentence, you don't give every
    word the same focus. You lean on the words that matter. Attention lets a model
    do the same thing.
  transition: defocus
  params:
    kicker: ATTENTION
    title: Focus on the words *that matter*
    sentence:
    - The
    - cat
    - sat
    - 'on'
    - the
    - mat
    - because
    - it
    - was
    - tired
    focus: 7
    links:
    - to: 1
      weight: 1
    - to: 9
      weight: 0.5
    - to: 5
      weight: 0.18
    from_word: lean
- id: trans
  type: site
  say: That idea powers transformers, the backbone of models like GPT, BERT, and T5.
    Older models read text one piece at a time. Transformers use self attention to
    connect words across long distances, and that helps their output stay coherent.
  transition: defocus
  params:
    src: assets/shots/attention.jpg
    url: arxiv.org
    kicker: TRANSFORMERS
    title: The backbone of *GPT, BERT, T5*
    title_size: 60
    notes:
    - text: 'Older models: one piece at a time'
      word: older
    - text: 'Self-attention: connect words across long distances'
      word: self
    - text: Output that stays *coherent*
      word: coherent
- id: gan
  type: versus
  say: Next, GANs, or generative adversarial networks. Picture two networks in competition.
    The generator creates new data, like an image. The discriminator judges whether
    it looks real. As they compete, the results become highly realistic.
  transition: defocus
  params:
    kicker: GANs
    title: Two networks in *competition*
    image: assets/photo/wikimedia-61684334.jpg
    left_word: generator
    right_word: discriminator
    real_word: realistic
- id: m_gan
  type: footage
  say: It's basically a very productive argument.
  transition: cut
  params:
    clip: planks
    frames: 150
    fps: 30
    speed: 1
    loop: false
    title: GENERATOR vs *DISCRIMINATOR*
    title_at: 0
    title_pos: top
    push: 0.04
    treat: []
  bars: 1.75
  cues:
  - lt: 0.2
    type: hit
    lvl: 3
  - lt: 1.89
    type: laugh
    lvl: 3
- id: ae
  type: hourglass
  say: Then, autoencoders. They squeeze data down into a smaller form, and then rebuild
    it. That's useful for compression, for removing noise, and for spotting anomalies.
  transition: defocus
  params:
    kicker: AUTOENCODERS
    title: Squeeze it down, then *rebuild it*
    labels:
    - t: Input
      word: data
    - t: Smaller form
      word: smaller
    - t: '*Rebuilt*'
      word: rebuild
- id: vae
  type: cards
  say: A variational autoencoder adds probability to that squeeze. So instead of only
    copying, it can generate new data that's similar to what it learned from.
  transition: defocus
  params:
    kicker: VARIATIONAL AUTOENCODERS
    title: From *copying* to *creating*
    cols: 2
    items:
    - tag: AUTOENCODER
      t: Compress and rebuild
      d: Learns a smaller version of its input
      word: squeeze
    - tag: VAE
      t: Adds probability
      d: Generates new data similar to what it learned
      word: generate
- id: s1end
  type: statement
  say: You don't have to build these from scratch today. Just understand the idea
    behind each one, because the tools in the next steps depend on them.
  transition: defocus
  params:
    lines:
    - text: Don't build these *from scratch*
      word: build
    - text: Just understand the idea behind each one
      word: understand
      size: 62
- id: s2
  type: roadmap
  say: Step two is where you start building. Knowing how a model works is one thing.
    Getting it inside a real app is another.
  chapter: 'Step 2: LangChain'
  transition: defocus
  params:
    kicker: THE GENAI ENGINEER ROADMAP
    nodes: *id001
    open_wide: 1.1
    visits:
    - i: 1
      t: 0
    - i: 2
      t: 1.0
      word: building
- id: lc
  type: site
  say: LangChain is a framework for exactly that. It handles the plumbing around a
    language model, so you can bring in data, process your text, and talk to the model.
  transition: defocus
  params:
    src: assets/shots/langchain.jpg
    url: langchain.com
    kicker: STEP 2
    title: LangChain
    notes:
    - text: Bring in data
      word: data
    - text: Process your text
      word: process
    - text: Talk to the *model*
      word: talk
- id: lcparts
  type: flow
  say: Its key pieces have names you'll see everywhere. Document loaders, embeddings,
    and vector stores. We'll come back to those last two very soon.
  transition: defocus
  params:
    kicker: STEP 2
    title: Names you'll see *everywhere*
    nodes:
    - label: Document loaders
      glyph: PDF
      sub: bring your data in
      word: document
    - label: Embeddings
      glyph: vec
      sub: meaning as numbers
      word: embeddings
    - label: Vector stores
      glyph: '[ ]'
      sub: search by meaning
      word: vector
- id: models
