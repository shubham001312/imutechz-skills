- id: ft
  type: flow
  say: Pre trained models like GPT and BERT have learned general patterns. Fine tuning
    adapts one to a specific job, like classifying text, sentiment analysis, or answering
    questions. You adjust its weights using your own dataset, while it keeps its general
    knowledge.
  transition: defocus
  params:
    kicker: STEP 6
    title: General model, *specific job*
    nodes:
    - label: Pre-trained model
      glyph: GPT
      sub: general patterns
      word: trained
    - label: Your dataset
      glyph: '[ ]'
      sub: adjust the weights
      word: adjust
    - label: Tuned model
      glyph: OK
      sub: keeps general knowledge, does one job well
      word: keeps
- id: ft2
  type: cards
  say: You'll meet a lot of names here. Reinforcement learning from human feedback
    uses people's ratings to guide the model. Parameter efficient fine tuning, or
    PEFT, changes only a small part of the model. LoRA and QLoRA are popular ways
    of doing that.
  transition: defocus
  params:
    kicker: STEP 6
    title: A lot of names
    items:
    - tag: RLHF
      t: People's ratings guide the model
      word: reinforcement
    - tag: PEFT
      t: Change only a small part
      word: parameter
    - tag: LoRA + QLoRA
      t: Popular ways of doing that
      word: LoRA
    t_size: 46
- id: ft3
  type: cards
  say: Others include prompt tuning, instruction tuning, and supervised fine tuning.
    And there's distillation, which teaches a smaller model to copy a larger one.
  transition: defocus
  params:
    kicker: STEP 6
    title: And a few more
    cols: 4
    items:
