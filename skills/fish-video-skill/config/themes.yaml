# Themes: a whole look in one id. `brief.yaml -> theme: <id>` (or the interview's theme question).
# A theme differs from the others in four ways, not just colour:
#   type      fonts.display / sans / serif / mono / hand (all OFL or Apache-2.0, fetched by `npm install`)
#   texture   the surface: paper | grain | clean | grid | blueprint | halftone | scanlines | notebook | dots | sunburst | stripes | film
#   layout    kicker (chip|underline|tape|bracket|pill|bar), card (panel|outline|flat|sticker|glass|ticket), radius, border,
#             caps, weight, track, shadow (soft|hard|none|glow), align, scrim, dim
#   motion    speed (1 = classic), rise (travel of entrances), push (camera push-in on photos), captions (style + fill/stroke/case)
# Existing projects are unchanged: a brief without `theme:` keeps using brand.* and the style palettes.
# Override one thing without leaving the theme:  theme_overrides: {colors: {accent: "#ff0066"}, fonts: {display: Anton}}
# Every colour pair is checked by tests (ink/bg >= 7:1, muted/bg >= 4.5:1, accent/bg >= 3:1).
# Contribution rule: a new theme must change at least three of type / texture / layout / motion against every other theme.

themes:
  archive-doc:
    label: "Documentary archive"
    genre: documentary
    best_for: "history, true stories, people, 'the man who...' (real photos lead)"
    mode: dark
    colors: {bg: "#15110c", surface: "#211a12", paper: "#1b150f", ink: "#f1e8d4", fg: "#e9dfc8", muted: "#b9ad93", dim: "#8a7f68", accent: "#d9863a", accent2: "#8fb4a3"}
    fonts: {display: "Special Elite", sans: "Source Serif 4", serif: "Source Serif 4", mono: "Courier Prime", hand: "Special Elite"}
    texture: film
    layout: {kicker: tape, card: flat, radius: 4, border: 2, caps: true, weight: 400, track: 0.01, shadow: hard, align: left, scrim: 0.62, dim: 0.5}
    motion: {speed: 0.85, rise: 0.6, push: 1.5}
    captions: {style: minimal, fill: "#f1e8d4", stroke: "#15110c", stroke_w: ".06em", case: none}
    style: glow-metaphor
    music: dark-drone
    delivery: calm
