- id: s3
  type: roadmap
  say: Step three answers a simple question. How does a model find the right information
    in a huge pile of data?
  chapter: 'Step 3: Vector stores'
  transition: defocus
  params:
    kicker: THE GENAI ENGINEER ROADMAP
    nodes: *id001
    open_wide: 1.1
    visits:
    - i: 2
      t: 0
    - i: 3
      t: 1.0
      word: simple
- id: emb
  type: meaning
  say: The answer starts with embeddings. An embedding turns text into a list of numbers
    that captures its meaning. So text with similar meanings ends up close together,
    even when the words are different.
  transition: defocus
  params:
    kicker: EMBEDDINGS
    title: Similar meaning, *close together*
    title_size: 58
    groups:
    - x: 0.2
      y: 0.3
      words:
      - puppy
      - dog
      - kitten
      - pet
      word: numbers
    - x: 0.78
      y: 0.28
      words:
      - invoice
      - refund
      - payment
      word: meaning
    - x: 0.5
      y: 0.72
      words:
      - pizza
      - pasta
      - dinner
      word: similar
- id: search
  type: meaning
  say: Ask about a sick puppy, and it lands right next to the pets, because meaning
    is what gets compared, and not exact words.
  transition: cut
  params:
    kicker: SEMANTIC SEARCH
    title: Search by *meaning*, not exact words
    title_size: 58
    groups:
    - x: 0.2
      y: 0.3
      words:
      - puppy
      - dog
      - kitten
      - pet
      at: -1
    - x: 0.78
      y: 0.28
      words:
      - invoice
      - refund
      - payment
      at: -1
    - x: 0.5
      y: 0.72
      words:
      - pizza
      - pasta
      - dinner
      at: -1
    query:
      text: my dog seems unwell
      x: 0.34
      y: 0.66
      group: 0
      word: sick
- id: vdb
  type: site
  say: A vector database stores those numbers, so you can search them by similarity.
    The guide names four of them. FAISS, Pinecone, ChromaDB, and Weaviate.
  transition: defocus
  params:
    kicker: VECTOR DATABASES
    title: Store them, *search them*
    title_size: 62
    shots:
    - src: assets/shots/faiss.jpg
      url: github.com/facebookresearch/faiss
      word: FAISS
    - src: assets/shots/pinecone_c.jpg
      url: pinecone.io
      word: Pinecone
    - src: assets/shots/chroma.jpg
      url: trychroma.com
      word: ChromaDB
    - src: assets/shots/weaviate_c.jpg
      url: weaviate.io
      word: Weaviate
    notes:
    - text: Stores the numbers
      word: stores
    - text: Search by *similarity*
      word: similarity
- id: sem
  type: flow
  say: Put it together, and you've got a semantic search engine. Turn your documents
    into embeddings. Store them in a vector database. Then turn each question into
    an embedding, and look for the closest match.
  transition: defocus
  params:
    kicker: STEP 3
    title: A semantic search engine
    nodes:
    - label: Documents to embeddings
      glyph: '1'
      word: documents
    - label: Store in a vector database
      glyph: '2'
      word: store
    - label: Question to embedding
      glyph: '3'
      word: question
    - label: Closest *match*
      glyph: '4'
      word: closest
    size: 40
- id: try3
  type: flow
  say: Here's a nice exercise. Take a few of your own notes, turn them into embeddings,
